name: build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Build
        run: |
          set +e
          gradle build --no-daemon > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            grep -nE "error:|What went wrong|Could not|FAILED|Caused by|not found|cannot find" -A2 build.log | head -40 | sed -e ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' | while read -r l; do echo "::error title=build-log::$l"; done
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with:
          name: critbot-jar
          path: build/libs/*.jar
      - name: Publish release
        run: |
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest build/libs/critbot-*.jar --title "CritBot (latest build)" --notes "Auto-built jar. Needs Fabric API, Minecraft 1.21.11."
        env:
          GH_TOKEN: ${{ github.token }}
